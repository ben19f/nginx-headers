events {}

http {

   geo $trusted_proxy {
        default 0;
        172.30.0.0/24 1;
    }

    map $trusted_proxy $xff {
        0 $remote_addr;
        1 "$http_x_forwarded_for, $remote_addr";
    }

    server {
        listen 80;

        location / {

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $xff;

            proxy_pass http://nginx2:80;
        }
    }
}