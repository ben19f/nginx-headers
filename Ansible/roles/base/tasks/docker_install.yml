- name: Update apt cache
  apt:
    update_cache: yes


- name: Install required packages (ca-certificates, curl)
  apt:
    name:
      - ca-certificates
      - curl
    state: present

- name: Create directory for Docker GPG key
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker's official GPG key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Determine Debian version codename
  shell: . /etc/os-release && echo "$VERSION_CODENAME"
  register: debian_codename
  changed_when: false

- name: Determine system architecture
  command: dpkg --print-architecture
  register: system_architecture
  changed_when: false

- name: Add Docker repository to Apt sources
  copy:
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ debian_codename.stdout }}
      Components: stable
      Architectures: {{ system_architecture.stdout }}
      Signed-By: /etc/apt/keyrings/docker.asc
    dest: /etc/apt/sources.list.d/docker.sources

- name: Update apt cache after adding Docker repository
  apt:
    update_cache: yes

- name: Install Docker Engine and related components
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    install_recommends: no

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes


- name: Install Docker Compose plugin
  apt:
    name: docker-compose-plugin
    state: present