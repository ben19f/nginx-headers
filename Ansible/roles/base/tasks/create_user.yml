- name: Create user
  user:
    name: "{{ new_user }}"
    groups: sudo
    shell: /bin/bash
    create_home: yes

- name: Add SSH key
  authorized_key:
    user: "{{ new_user }}"
    key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

- name: Allow sudo without password
  copy:
    dest: "/etc/sudoers.d/{{ new_user }}"
    content: "{{ new_user }} ALL=(ALL) NOPASSWD:ALL"
    mode: '0440'
